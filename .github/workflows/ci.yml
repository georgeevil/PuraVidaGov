name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w apps/web
      - run: npm run e2e

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f infra/docker-compose.yml build
      - run: docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 120
      - run: node scripts/smoke.mjs http://localhost:3001
      - run: curl -sSf http://localhost:3000/ | grep -q PuraVidaGov
      - run: curl -sSfk https://localhost:8443/api/benefits
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs --no-color | tail -200
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v

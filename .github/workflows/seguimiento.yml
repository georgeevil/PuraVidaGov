name: Seguimiento
# Daily check of whether anything moved at the institutions that would have to move.
#
# Deliberately separate from CI: this workflow talks to the public internet, so it can fail for reasons
# that have nothing to do with the code. It must never be able to turn CI red — see
# docs/research/institutions-and-accountability.md §4 for why that distinction is load-bearing here.
on:
  schedule:
    - cron: '17 11 * * *'   # 05:17 Costa Rica, before anyone looks
  workflow_dispatch:

permissions:
  contents: write   # commit the state file
  issues: write     # open one issue per changed source

concurrency:
  group: seguimiento
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm ci: the script uses only the Node standard library, and installing the whole
      # workspace to fetch five URLs would be the slowest part of the job by an order of magnitude.
      - name: Check the sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/seguimiento-check.mjs

      - name: Commit the state file if it moved
        run: |
          if git diff --quiet -- docs/seguimiento-estado.json; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/seguimiento-estado.json
          git commit -m "Seguimiento: estado del $(date -u +%F)"
          git push
